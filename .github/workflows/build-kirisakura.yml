name: Build Kirisakura Release_S_2 B1C1 + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches: [kirisakura]

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig
  AK3_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: kirisakura
          fetch-depth: 1
          submodules: false

      - name: Copy kernel source to runner temp
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/kirisakura-kernel"
          mkdir -p "$RUNNER_TEMP/kirisakura-kernel"
          cp -a ./. "$RUNNER_TEMP/kirisakura-kernel/"
          echo "KERNEL_WORKDIR=$RUNNER_TEMP/kirisakura-kernel" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/kirisakura-kernel/Makefile"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 device-tree-compiler git build-essential gcc g++ zip unzip lz4 perl

      - name: Install Android 12 mkdtimg
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android-12.0.0_r34 https://android.googlesource.com/platform/prebuilts/misc "$RUNNER_TEMP/prebuilts-misc"
          MKDTIMG="$RUNNER_TEMP/prebuilts-misc/linux-x86/libufdt/mkdtimg"
          test -f "$MKDTIMG"
          test -x "$MKDTIMG"
          sudo install -m 0755 "$MKDTIMG" /usr/local/bin/mkdtimg
          mkdtimg help all

      - name: Verify Kirisakura Release_S_2 source
        shell: bash
        working-directory: ${{ env.KERNEL_WORKDIR }}
        run: |
          set -euxo pipefail
          test -f Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^# CONFIG_LTO_CLANG is not set$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_CFI_CLANG=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_KERNEL_LZ4=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          test -d drivers/kernelsu
          grep -Rqs 'SUSFS_VERSION' drivers/kernelsu fs include

      - name: Apply source-compatible build fixes
        shell: bash
        working-directory: ${{ env.KERNEL_WORKDIR }}
        run: |
          set -euxo pipefail

          # Release_S_2 carries the original procfs reporting code, but this
          # fork's mm API no longer exposes nr_ptes/mm_nr_pmds. Keep the
          # VmPTE/VmPMD fields present while avoiding unavailable APIs.
          perl -0pi -e 's/ptes = PTRS_PER_PTE \* sizeof\(pte_t\) \* atomic_long_read\(&mm->nr_ptes\);/ptes = 0;/g; s/pmds = PTRS_PER_PMD \* sizeof\(pmd_t\) \* mm_nr_pmds\(mm\);/pmds = 0;/g' fs/proc/task_mmu.c

          # msm_geni_console_port is an array; initialize the mutex belonging
          # to the current console-port element.
          perl -0pi -e 's/mutex_init\(&msm_geni_console_port\.ioctl_mutex\);/mutex_init\(&msm_geni_console_port[i].ioctl_mutex\);/g' drivers/tty/serial/msm_geni_serial.c

          # KSU-Next is already embedded in this source tree. Do not let the
          # build action attempt to recurse into a stale/missing submodule URL.
          rm -f .gitmodules
          rm -rf .git/modules/KernelSU-Next

          grep -n 'ptes = 0;' fs/proc/task_mmu.c
          grep -n 'pmds = 0;' fs/proc/task_mmu.c
          grep -n 'msm_geni_console_port\[i\]\.ioctl_mutex' drivers/tty/serial/msm_geni_serial.c
          test ! -f .gitmodules

      - name: Build Kirisakura Release_S_2 kernel with AnyKernel3
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
          kernel-url: ${{ env.KERNEL_WORKDIR }}
          kernel-branch: kirisakura
          config: b1c1_defconfig
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-clang-version: r416183b
          aosp-gcc: true
          disable-lto: true
          anykernel3: true
          anykernel3-url: ${{ env.AK3_REPO }}
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Locate kernel and DTBO outputs
        shell: bash
        run: |
          set -euxo pipefail
          KERNEL="$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -type f -name 'Image.lz4-dtb' -print -quit)"
          DTBO="$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -type f -name 'dtbo.img' -print -quit)"
          test -n "$KERNEL"
          test -s "$KERNEL"
          test -n "$DTBO"
          test -s "$DTBO"
          echo "KERNEL_IMAGE=$KERNEL" >> "$GITHUB_ENV"
          echo "DTBO_IMAGE=$DTBO" >> "$GITHUB_ENV"

      - name: Build flash-ready Osmosis AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/anykernel-package"
          git clone --depth=1 "$AK3_REPO" "$RUNNER_TEMP/anykernel-package"
          cd "$RUNNER_TEMP/anykernel-package"
          rm -rf .git .github
          rm -f README.md Image Image.* zImage zImage.* dtb dtb.img dtbo.img anykernel.sh
          cp "$KERNEL_IMAGE" ./Image.lz4-dtb
          cp "$DTBO_IMAGE" ./dtbo.img
          {
            echo '# AnyKernel3 - Bias8145 Kirisakura Release_S_2 B1C1 Pixel 3/3 XL'
            echo 'properties() {'
            echo "  kernel.string=Bias8145 Kirisakura Release_S_2 B1C1 Kernel"
            echo '  do.devicecheck=1'
            echo '  do.modules=0'
            echo '  do.systemless=0'
            echo '  do.cleanup=1'
            echo '  do.cleanuponabort=0'
            echo '  device.name1=blueline'
            echo '  device.name2=crosshatch'
            echo '  supported.versions='
            echo '  supported.patchlevels='
            echo '  supported.vendorpatchlevels='
            echo '}'
            echo 'BLOCK=boot;'
            echo 'IS_SLOT_DEVICE=1;'
            echo 'RAMDISK_COMPRESSION=auto;'
            echo 'PATCH_VBMETA_FLAG=auto;'
            echo '. tools/ak3-core.sh;'
            echo 'dump_boot;'
            echo 'flash_dtbo;'
            echo 'write_boot;'
          } > anykernel.sh
          chmod 0755 anykernel.sh
          grep -q 'device.name1=blueline' anykernel.sh
          grep -q 'device.name2=crosshatch' anykernel.sh
          grep -q '^supported.versions=$' anykernel.sh
          grep -q '^BLOCK=boot;' anykernel.sh
          grep -q '^IS_SLOT_DEVICE=1;' anykernel.sh
          grep -q 'flash_dtbo;' anykernel.sh
          grep -q 'write_boot;' anykernel.sh
          test -s Image.lz4-dtb
          test -s dtbo.img
          cd "$GITHUB_WORKSPACE"
          rm -f Kirisakura-Release-S_2-B1C1-AnyKernel3.zip Kirisakura-Release-S_2-B1C1-AnyKernel3.sha256
          cd "$RUNNER_TEMP/anykernel-package"
          zip -r9 "$GITHUB_WORKSPACE/Kirisakura-Release-S_2-B1C1-AnyKernel3.zip" . -x '.git/*' '.github/*' 'README.md' '*placeholder*'
          cd "$GITHUB_WORKSPACE"
          unzip -t Kirisakura-Release-S_2-B1C1-AnyKernel3.zip
          unzip -l Kirisakura-Release-S_2-B1C1-AnyKernel3.zip | grep -E 'Image\.lz4-dtb|dtbo\.img|anykernel\.sh|tools/ak3-core\.sh|META-INF/com/google/android/update-binary|LICENSE'
          sha256sum Kirisakura-Release-S_2-B1C1-AnyKernel3.zip | tee Kirisakura-Release-S_2-B1C1-AnyKernel3.sha256

      - name: Upload flash-ready AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-Release-S_2-B1C1-AnyKernel3-ready
          path: |
            Kirisakura-Release-S_2-B1C1-AnyKernel3.zip
            Kirisakura-Release-S_2-B1C1-AnyKernel3.sha256

      - name: Create GitHub pre-release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="kirisakura-release-s2-b1c1-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Kirisakura-Release-S_2-B1C1-AnyKernel3.zip Kirisakura-Release-S_2-B1C1-AnyKernel3.sha256 --repo "$GITHUB_REPOSITORY" --prerelease --title "Kirisakura Release_S_2 B1C1 Kernel ${GITHUB_RUN_NUMBER}" --notes "Kirisakura Release_S_2 baseline for Pixel 3/3 XL. Osmosis AnyKernel3 package. Android compatibility follows the source/release; no Android-version restriction is embedded in the installer. Hardware boot validation is required before treating a build as production-safe."
