name: Build Kirisakura B1C1 Android 12 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches: [kirisakura]

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig
  AK3_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: kirisakura
          fetch-depth: 1
          submodules: false

      - name: Copy kernel source to runner temp
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/kirisakura-kernel"
          mkdir -p "$RUNNER_TEMP/kirisakura-kernel"
          cp -a ./. "$RUNNER_TEMP/kirisakura-kernel/"
          echo "KERNEL_WORKDIR=$RUNNER_TEMP/kirisakura-kernel" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/kirisakura-kernel/Makefile"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 device-tree-compiler git build-essential gcc g++ zip unzip lz4

      - name: Install Android 12 mkdtimg
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android-12.0.0_r34 https://android.googlesource.com/platform/prebuilts/misc "$RUNNER_TEMP/prebuilts-misc"
          MKDTIMG="$RUNNER_TEMP/prebuilts-misc/linux-x86/libufdt/mkdtimg"
          test -f "$MKDTIMG"
          test -x "$MKDTIMG"
          sudo install -m 0755 "$MKDTIMG" /usr/local/bin/mkdtimg
          mkdtimg help all

      - name: Verify Kirisakura B1C1 source
        shell: bash
        working-directory: ${{ env.KERNEL_WORKDIR }}
        run: |
          set -euxo pipefail
          test -f Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^# CONFIG_LTO_CLANG is not set$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_CFI_CLANG=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_KERNEL_LZ4=y$' "arch/${ARCH}/configs/${DEFCONFIG}"

      - name: Build Kirisakura kernel with AnyKernel3
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
          kernel-url: ${{ env.KERNEL_WORKDIR }}
          kernel-branch: kirisakura
          config: b1c1_defconfig
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-clang-version: r416183b
          aosp-gcc: true
          disable-lto: true
          anykernel3: true
          anykernel3-url: ${{ env.AK3_REPO }}
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Locate kernel and DTBO outputs
        shell: bash
        run: |
          set -euxo pipefail
          KERNEL="$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -type f -name 'Image.lz4-dtb' -print -quit)"
          DTBO="$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -type f -name 'dtbo.img' -print -quit)"
          test -n "$KERNEL"
          test -s "$KERNEL"
          test -n "$DTBO"
          test -s "$DTBO"
          echo "KERNEL_IMAGE=$KERNEL" >> "$GITHUB_ENV"
          echo "DTBO_IMAGE=$DTBO" >> "$GITHUB_ENV"

      - name: Build flash-ready Pixel 3 AnyKernel3 from Osmosis template
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/anykernel-package"
          git clone --depth=1 "$AK3_REPO" "$RUNNER_TEMP/anykernel-package"
          cd "$RUNNER_TEMP/anykernel-package"
          rm -rf .git .github
          rm -f README.md Image Image.* zImage zImage.* dtb dtb.img dtbo.img anykernel.sh
          cp "$KERNEL_IMAGE" ./Image.lz4-dtb
          cp "$DTBO_IMAGE" ./dtbo.img
          {
            echo '# AnyKernel3 - Bias8145 Kirisakura B1C1 Pixel 3 Android 12'
            echo 'properties() {'
            echo "  kernel.string=Bias8145 Kirisakura B1C1 Android 12 Kernel"
            echo '  do.devicecheck=1'
            echo '  do.modules=0'
            echo '  do.systemless=0'
            echo '  do.cleanup=1'
            echo '  do.cleanuponabort=0'
            echo '  device.name1=blueline'
            echo '  supported.versions=12'
            echo '  supported.patchlevels='
            echo '  supported.vendorpatchlevels='
            echo '}'
            echo 'BLOCK=boot;'
            echo 'IS_SLOT_DEVICE=1;'
            echo 'RAMDISK_COMPRESSION=auto;'
            echo 'PATCH_VBMETA_FLAG=auto;'
            echo '. tools/ak3-core.sh;'
            echo 'dump_boot;'
            echo 'flash_dtbo;'
            echo 'write_boot;'
          } > anykernel.sh
          chmod 0755 anykernel.sh
          grep -q 'device.name1=blueline' anykernel.sh
          grep -q 'supported.versions=12' anykernel.sh
          grep -q '^BLOCK=boot;' anykernel.sh
          grep -q '^IS_SLOT_DEVICE=1;' anykernel.sh
          grep -q 'flash_dtbo;' anykernel.sh
          grep -q 'write_boot;' anykernel.sh
          test -s Image.lz4-dtb
          test -s dtbo.img
          cd "$GITHUB_WORKSPACE"
          rm -f Kirisakura-B1C1-A12-AnyKernel3.zip Kirisakura-B1C1-A12-AnyKernel3.sha256
          cd "$RUNNER_TEMP/anykernel-package"
          zip -r9 "$GITHUB_WORKSPACE/Kirisakura-B1C1-A12-AnyKernel3.zip" . -x '.git/*' '.github/*' 'README.md' '*placeholder*'
          cd "$GITHUB_WORKSPACE"
          unzip -t Kirisakura-B1C1-A12-AnyKernel3.zip
          unzip -l Kirisakura-B1C1-A12-AnyKernel3.zip | grep -E 'Image\.lz4-dtb|dtbo\.img|anykernel\.sh|tools/ak3-core\.sh|META-INF/com/google/android/update-binary|LICENSE'
          sha256sum Kirisakura-B1C1-A12-AnyKernel3.zip | tee Kirisakura-B1C1-A12-AnyKernel3.sha256

      - name: Upload flash-ready AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-B1C1-A12-AnyKernel3-ready
          path: |
            Kirisakura-B1C1-A12-AnyKernel3.zip
            Kirisakura-B1C1-A12-AnyKernel3.sha256

      - name: Create GitHub pre-release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="kirisakura-b1c1-a12-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Kirisakura-B1C1-A12-AnyKernel3.zip Kirisakura-B1C1-A12-AnyKernel3.sha256 --repo "$GITHUB_REPOSITORY" --prerelease --title "Kirisakura B1C1 Android 12 Kernel ${GITHUB_RUN_NUMBER}" --notes "Kirisakura B1C1 (Pixel 3 / blueline) Android 12-targeted kernel. Package uses the Osmosis AnyKernel3 template. Hardware boot validation is required before treating a build as production-safe."
