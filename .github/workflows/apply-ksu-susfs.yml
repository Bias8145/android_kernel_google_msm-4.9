name: Apply all thirteen-next-2 commits to Kirisakura

on:
  workflow_dispatch:
  push:
    branches: [kirisakura]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kirisakura
          fetch-depth: 0

      - name: Cherry-pick all commits from 2026-05-21 through 2026-07-18
        shell: bash
        run: |
          set -u -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin kirisakura thirteen-next-2 --prune
          git checkout -B kirisakura origin/kirisakura

          mapfile -t ALL < <(git log origin/thirteen-next-2 --reverse --format=%H --since='2026-05-21T00:00:00+00:00' --until='2026-07-18T23:59:59+00:00')
          echo "Found ${#ALL[@]} commits in requested period"
          test "${#ALL[@]}" -eq 100

          : > /tmp/applied.txt
          for c in "${ALL[@]}"; do
            echo "=== APPLY $c ==="
            git show -s --format='%H%n%aI%n%cI%n%s' "$c"
            if ! git cherry-pick -x "$c"; then
              echo "CONFLICT while applying $c"
              git status --short
              git cherry-pick --abort || true
              exit 1
            fi
            printf '%s %s\n' "$c" "$(git show -s --format=%s "$c")" >> /tmp/applied.txt
          done

          echo '=== APPLIED COMMITS ==='
          cat /tmp/applied.txt
          test "$(wc -l < /tmp/applied.txt)" -eq 100

          echo '=== VERIFY RESULT ==='
          git status --short
          git log --oneline -n 30
          test -f Makefile

          rm -f .github/workflows/apply-ksu-susfs.yml
          git add -A
          git commit -m "chore: remove temporary backport workflow"
          git push origin HEAD:kirisakura
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
