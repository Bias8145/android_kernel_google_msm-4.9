name: Build B1C1 Android 10 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches:
      - test

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 device-tree-compiler git build-essential gcc g++ zip unzip lz4

      - name: Install AOSP Android 10 mkdtimg prebuilt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/misc "$RUNNER_TEMP/prebuilts-misc"
          MKDTIMG="$RUNNER_TEMP/prebuilts-misc/linux-x86/libufdt/mkdtimg"
          test -f "$MKDTIMG"
          test -x "$MKDTIMG"
          sudo install -m 0755 "$MKDTIMG" /usr/local/bin/mkdtimg
          mkdtimg help all

      - name: Prepare B1C1 Android 10 build baseline
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/prepare_b1c1_a10.sh
          scripts/prepare_b1c1_a10.sh

      - name: Verify B1C1 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f Makefile
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 9$' Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^# CONFIG_LTO_CLANG is not set$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_CFI_CLANG=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' "arch/${ARCH}/configs/${DEFCONFIG}"

      - name: Build kernel
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
          kernel-url: .
          config: b1c1_defconfig
          arch: arm64
          android-version: 10
          aosp-clang: true
          aosp-clang-version: r353983c
          aosp-gcc: true
          disable-lto: true
          anykernel3: false
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          test -d out
          KERNEL="$(find out -type f \( -name 'Image.lz4-dtb' -o -name 'Image.gz-dtb' -o -name 'Image-dtb' -o -name 'zImage' \) -print -quit)"
          test -n "$KERNEL"
          test -s "$KERNEL"
          rm -rf anykernel-package
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel-package
          rm -f anykernel-package/Image* anykernel-package/zImage* anykernel-package/dtb* anykernel-package/dtbo.img
          cp "$KERNEL" anykernel-package/
          printf '%s\n' \
            "properties() { '" \
            'kernel.string=Bias8145 B1C1 Android 10 Kernel' \
            'do.devicecheck=1' \
            'device.name1=blueline' \
            'supported.versions=10' \
            "'; }" \
            '' \
            'BLOCK=auto;' \
            'IS_SLOT_DEVICE=1;' \
            'RAMDISK_COMPRESSION=auto;' \
            'PATCH_VBMETA_FLAG=auto;' \
            '' \
            '. tools/ak3-core.sh;' \
            'dump_boot;' \
            'write_boot;' \
            > anykernel-package/anykernel.sh
          chmod 0755 anykernel-package/anykernel.sh
          grep -q 'device.name1=blueline' anykernel-package/anykernel.sh
          grep -q 'supported.versions=10' anykernel-package/anykernel.sh
          grep -q 'IS_SLOT_DEVICE=1' anykernel-package/anykernel.sh
          rm -f B1C1-A10-AnyKernel3.zip B1C1-A10-AnyKernel3.sha256
          (cd anykernel-package && zip -r -9 "$GITHUB_WORKSPACE/B1C1-A10-AnyKernel3.zip" .)
          unzip -t B1C1-A10-AnyKernel3.zip
          sha256sum B1C1-A10-AnyKernel3.zip | tee B1C1-A10-AnyKernel3.sha256

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: B1C1-A10-AnyKernel3
          path: |
            B1C1-A10-AnyKernel3.zip
            B1C1-A10-AnyKernel3.sha256
