name: Build B1C1 Android 10 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches: [test]

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
          submodules: false

      - name: Install Android DT build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip device-tree-compiler git build-essential gcc g++

      - name: Build mkdtimg from AOSP libufdt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt "$RUNNER_TEMP/libufdt"
          cd "$RUNNER_TEMP/libufdt"
          echo "=== Checking directory contents ==="
          ls -la
          
          # Try to build mkdtimg
          if [ -f Makefile ]; then
            echo "=== Found Makefile, building with make ==="
            make -j"$(nproc)"
          elif [ -f Android.bp ]; then
            echo "=== Found Android.bp, building from Python source ==="
            python3 -m pip install pyyaml > /dev/null 2>&1 || true
            # Build mkdtimg executable from Python utils
            python3 -c "
import sys
import os
sys.path.insert(0, os.getcwd())
from utils import mkdtimg
print('mkdtimg module loaded successfully')
"
            # Create a simple wrapper script
            cat > mkdtimg << 'EOF'
#!/usr/bin/env python3
import sys
import os
sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
from utils import mkdtimg
if __name__ == '__main__':
    mkdtimg.main()
EOF
            chmod +x mkdtimg
          else
            echo "ERROR: No build configuration found (Makefile or Android.bp)"
            exit 1
          fi
          
          # Verify mkdtimg exists
          echo "=== Looking for mkdtimg binary ==="
          MKDTIMG=$(find . -type f -name mkdtimg -perm -111 | head -n1)
          if [ -z "$MKDTIMG" ]; then
            echo "WARNING: No mkdtimg binary found, checking for script..."
            MKDTIMG="./mkdtimg"
            if [ ! -f "$MKDTIMG" ]; then
              echo "ERROR: mkdtimg not found anywhere"
              exit 1
            fi
          fi
          
          echo "=== Installing mkdtimg to /usr/local/bin ==="
          sudo install -m 0755 "$MKDTIMG" /usr/local/bin/mkdtimg
          command -v mkdtimg
          mkdtimg --help || echo "mkdtimg installed (help may not work with wrapper)"

      - name: Verify B1C1 source before action
        shell: bash
        run: |
          set -euxo pipefail
          test -f Makefile
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 9$' Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          echo "Source: $(git rev-parse HEAD)"
          echo "Defconfig: ${DEFCONFIG}"

      - name: Build kernel with kernel_build_action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Bias8145/android_kernel_google_msm-4.9
          kernel-branch: test
          config: b1c1_defconfig
          arch: arm64
          android-version: 10
          aosp-clang: true
          aosp-clang-version: r353983c
          aosp-gcc: true
          anykernel3: true
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Validate AnyKernel3 output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find . -type f -name '*.zip' -print
          count=$(find . -type f -name '*.zip' | wc -l)
          test "$count" -ge 1
          echo "AnyKernel3 ZIP count: $count"

      - name: Validate kernel build output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find . -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name 'Image.lz4' -o -name '*.dtb' -o -name 'dtbo.img' \) -print
