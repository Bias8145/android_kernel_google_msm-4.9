name: Build B1C1 Android 10 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches:
      - test

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 device-tree-compiler git build-essential gcc g++ zip unzip lz4

      - name: Install AOSP Android 10 mkdtimg prebuilt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/misc \
            "$RUNNER_TEMP/prebuilts-misc"
          MKDTIMG="$RUNNER_TEMP/prebuilts-misc/linux-x86/libufdt/mkdtimg"
          test -f "$MKDTIMG"
          test -x "$MKDTIMG"
          sudo install -m 0755 "$MKDTIMG" /usr/local/bin/mkdtimg
          command -v mkdtimg
          mkdtimg help all

      - name: Prepare B1C1 Android 10 config
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/prepare_b1c1_a10.sh
          scripts/prepare_b1c1_a10.sh

      - name: Verify B1C1 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f Makefile
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 9$' Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARM64:-arm64}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_LTO_CLANG=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_CFI_CLANG=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Defconfig: ${DEFCONFIG}"

      - name: Build kernel with kernel_build_action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: .
          config: b1c1_defconfig
          arch: arm64
          android-version: 10
          aosp-clang: true
          aosp-clang-version: r353983c
          aosp-gcc: true
          disable-lto: true
          anykernel3: false
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Locate and validate kernel outputs
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== kernel outputs ==='
          find . -type f \( \
            -name 'Image' -o \
            -name 'Image.gz' -o \
            -name 'Image.gz-dtb' -o \
            -name 'Image.lz4' -o \
            -name 'Image.lz4-dtb' -o \
            -name 'dtbo.img' \
          \) -print

          KERNEL="$(find . -type f \( -name 'Image.lz4-dtb' -o -name 'Image.gz-dtb' -o -name 'Image.lz4' -o -name 'Image.gz' -o -name 'Image' \) | head -n1)"
          test -n "$KERNEL"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          DTBO="$(find . -type f -name 'dtbo.img' | head -n1)"
          test -n "$DTBO"
          test -f "$DTBO"

      - name: Package with osm0sis AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/AnyKernel3"
          cd "$RUNNER_TEMP/AnyKernel3"
          cp "$GITHUB_WORKSPACE/$KERNEL" ./
          DTBO="$(find "$GITHUB_WORKSPACE" -type f -name 'dtbo.img' | head -n1)"
          cp "$DTBO" ./dtbo.img
          ZIP_NAME="B1C1-A10-AnyKernel3-$(date -u +%Y%m%d-%H%M).zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git/*' 'README.md' '*placeholder*'
          test -s "$GITHUB_WORKSPACE/$ZIP_NAME"
          unzip -t "$GITHUB_WORKSPACE/$ZIP_NAME"
          sha256sum "$GITHUB_WORKSPACE/$ZIP_NAME" | tee "$GITHUB_WORKSPACE/$ZIP_NAME.sha256"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: B1C1-A10-AnyKernel3
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="b1c1-a10-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/$ZIP_NAME" \
            "$GITHUB_WORKSPACE/$ZIP_NAME.sha256" \
            --target test \
            --title "B1C1 Android 10 Kernel $TAG" \
            --notes "B1C1 Pixel 3 kernel for Stock Android 10. AnyKernel3 package built from the test branch. Boot compatibility is not claimed until hardware boot testing is completed."
