name: Build B1C1 Android 10 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches:
      - test

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip device-tree-compiler git build-essential gcc g++

      - name: Install Android 10 mkdtimg
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android10-release https://android.googlesource.com/platform/system/libufdt "$RUNNER_TEMP/libufdt"
          test -f "$RUNNER_TEMP/libufdt/utils/src/mkdtimg.py"
          chmod +x "$RUNNER_TEMP/libufdt/utils/src/mkdtimg.py"
          cat > "$RUNNER_TEMP/mkdtimg" <<EOF
#!/usr/bin/env python3
import runpy
runpy.run_path("$RUNNER_TEMP/libufdt/utils/src/mkdtimg.py", run_name="__main__")
EOF
          chmod +x "$RUNNER_TEMP/mkdtimg"
          sudo install -m 0755 "$RUNNER_TEMP/mkdtimg" /usr/local/bin/mkdtimg
          command -v mkdtimg
          mkdtimg --help

      - name: Verify B1C1 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f Makefile
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 9$' Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Defconfig: ${DEFCONFIG}"

      - name: Build kernel with kernel_build_action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Bias8145/android_kernel_google_msm-4.9
          kernel-branch: test
          config: b1c1_defconfig
          arch: arm64
          android-version: 10
          aosp-clang: true
          aosp-clang-version: r353983c
          aosp-gcc: true
          anykernel3: true
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Validate AnyKernel3
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find . -type f -name '*.zip' -print
          count="$(find . -type f -name '*.zip' | wc -l)"
          test "$count" -ge 1
          echo "AnyKernel3 ZIP count: $count"

      - name: Validate kernel outputs
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find . -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name 'Image.lz4' -o -name '*.dtb' -o -name 'dtbo.img' \) -print
