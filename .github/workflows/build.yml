name: Build B1C1 Android 10 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches:
      - test

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 device-tree-compiler git build-essential gcc g++ zip unzip lz4

      - name: Install AOSP Android 10 mkdtimg prebuilt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/misc \
            "$RUNNER_TEMP/prebuilts-misc"
          MKDTIMG="$RUNNER_TEMP/prebuilts-misc/linux-x86/libufdt/mkdtimg"
          test -f "$MKDTIMG"
          test -x "$MKDTIMG"
          sudo install -m 0755 "$MKDTIMG" /usr/local/bin/mkdtimg
          command -v mkdtimg
          mkdtimg help all

      - name: Prepare B1C1 Android 10 build baseline
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/prepare_b1c1_a10.sh
          scripts/prepare_b1c1_a10.sh

      - name: Verify B1C1 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f Makefile
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 9$' Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^# CONFIG_LTO_CLANG is not set$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_CFI_CLANG=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' "arch/${ARCH}/configs/${DEFCONFIG}"

      - name: Build kernel with AnyKernel3
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
          kernel-url: .
          config: b1c1_defconfig
          arch: arm64
          android-version: 10
          aosp-clang: true
          aosp-clang-version: r353983c
          aosp-gcc: true
          disable-lto: true
          anykernel3: true
          anykernel3-url: https://github.com/osm0sis/AnyKernel3.git
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Finalize B1C1 Stock A10 AnyKernel3 package
        shell: bash
        run: |
          set -euxo pipefail
          test -d build
          test -f build/anykernel.sh
          test -f build/LICENSE

          echo '=== Kernel payload ==='
          find build -maxdepth 1 -type f -printf '%f\n' | sort
          KERNEL="$(find build -maxdepth 1 -type f \( -name 'Image*' -o -name 'zImage*' \) | head -n1)"
          test -n "$KERNEL"
          test -s "$KERNEL"

          # The Stock A10 boot image keeps its own ramdisk/DTB/DTBO.
          # Remove DTB/DTBO payloads produced by the action from this first
          # compatibility package so AnyKernel3 only replaces the kernel.
          rm -f build/dtbo.img build/dtb build/dtb.img

          cat > build/anykernel.sh <<'EOF'
properties() { '
kernel.string=Bias8145 B1C1 Android 10 Kernel
kernel.supported=Stock Android 10 / Pixel 3 B1C1 (blueline)
do.devicecheck=1
device.name1=blueline
supported.versions=10
'; }

BLOCK=auto;
IS_SLOT_DEVICE=1;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

. tools/ak3-core.sh;
dump_boot;
write_boot;
EOF

          chmod 0755 build/anykernel.sh
          grep -q 'device.name1=blueline' build/anykernel.sh
          grep -q 'supported.versions=10' build/anykernel.sh
          grep -q 'IS_SLOT_DEVICE=1' build/anykernel.sh
          grep -q 'BLOCK=auto;' build/anykernel.sh
          grep -q 'dump_boot;' build/anykernel.sh
          grep -q 'write_boot;' build/anykernel.sh

          echo '=== AnyKernel3 files ==='
          find build -maxdepth 2 -type f -printf '%p\n' | sort | head -300

          rm -f B1C1-A10-AnyKernel3.zip B1C1-A10-AnyKernel3.sha256
          (cd build && zip -r -9 "$GITHUB_WORKSPACE/B1C1-A10-AnyKernel3.zip" .)
          unzip -t B1C1-A10-AnyKernel3.zip
          unzip -l B1C1-A10-AnyKernel3.zip | sed -n '1,180p'
          unzip -p B1C1-A10-AnyKernel3.zip anykernel.sh > "$RUNNER_TEMP/anykernel.sh"
          grep -q 'device.name1=blueline' "$RUNNER_TEMP/anykernel.sh"
          grep -q 'supported.versions=10' "$RUNNER_TEMP/anykernel.sh"
          grep -q 'IS_SLOT_DEVICE=1' "$RUNNER_TEMP/anykernel.sh"
          sha256sum B1C1-A10-AnyKernel3.zip | tee B1C1-A10-AnyKernel3.sha256
          echo "ZIP=$GITHUB_WORKSPACE/B1C1-A10-AnyKernel3.zip" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: B1C1-A10-AnyKernel3
          path: |
            B1C1-A10-AnyKernel3.zip
            B1C1-A10-AnyKernel3.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="b1c1-a10-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/B1C1-A10-AnyKernel3.zip" \
            "$GITHUB_WORKSPACE/B1C1-A10-AnyKernel3.sha256" \
            --target test \
            --title "B1C1 Android 10 Kernel $TAG" \
            --notes "B1C1 Pixel 3 kernel for Stock Android 10. Boot compatibility still requires hardware testing."