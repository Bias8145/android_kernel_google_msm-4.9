name: Build B1C1 Android 10 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches: [test]

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Build kernel with kernel_build_action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Bias8145/android_kernel_google_msm-4.9
          kernel-branch: test
          config: b1c1_defconfig
          arch: arm64
          android-version: 10
          aosp-clang: true
          aosp-clang-version: r353983c
          aosp-gcc: true
          anykernel3: true
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Validate AnyKernel3 output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          echo '--- generated archives ---'
          find . -type f -name '*.zip' -print
          count=$(find . -type f -name '*.zip' | wc -l)
          test "$count" -ge 1
          echo "AnyKernel3 ZIP count: $count"

      - name: Validate kernel build output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find . -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name 'Image.lz4' -o -name '*.dtb' -o -name 'dtbo.img' \) -print
