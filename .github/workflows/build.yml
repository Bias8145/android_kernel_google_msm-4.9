name: Build B1C1 Android 10 Kernel + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches:
      - test

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: b1c1_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 device-tree-compiler git build-essential gcc g++ zip unzip lz4

      - name: Install AOSP Android 10 mkdtimg prebuilt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/misc \
            "$RUNNER_TEMP/prebuilts-misc"
          MKDTIMG="$RUNNER_TEMP/prebuilts-misc/linux-x86/libufdt/mkdtimg"
          test -f "$MKDTIMG"
          test -x "$MKDTIMG"
          sudo install -m 0755 "$MKDTIMG" /usr/local/bin/mkdtimg
          command -v mkdtimg
          mkdtimg help all

      - name: Prepare B1C1 Android 10 build baseline
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/prepare_b1c1_a10.sh
          scripts/prepare_b1c1_a10.sh

      - name: Verify B1C1 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f Makefile
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 9$' Makefile
          test -f "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_BOARD_B1C1=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^# CONFIG_LTO_CLANG is not set$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_CFI_CLANG=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' "arch/${ARCH}/configs/${DEFCONFIG}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Defconfig: ${DEFCONFIG}"

      - name: Build kernel with native AnyKernel3 packaging
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: .
          config: b1c1_defconfig
          arch: arm64
          android-version: 10
          aosp-clang: true
          aosp-clang-version: r353983c
          aosp-gcc: true
          disable-lto: true
          anykernel3: true
          anykernel3-url: https://github.com/osm0sis/AnyKernel3.git
          release: false
          extra-make-args: '["KCFLAGS=-Wno-missing-braces"]'

      - name: Locate and validate AnyKernel3 output
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== ZIP outputs ==='
          find . -type f -iname '*.zip' -print
          ZIP="$(find . -type f -iname '*.zip' | head -n1)"
          test -n "$ZIP"
          test -s "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -t "$ZIP"
          echo '=== AnyKernel3 contents ==='
          unzip -l "$ZIP" | sed -n '1,160p'
          unzip -p "$ZIP" anykernel.sh > "$RUNNER_TEMP/anykernel.sh"
          grep -q 'device.name1=blueline' "$RUNNER_TEMP/anykernel.sh"
          grep -q 'IS_SLOT_DEVICE=1' "$RUNNER_TEMP/anykernel.sh"
          grep -q 'BLOCK=' "$RUNNER_TEMP/anykernel.sh"
          unzip -p "$ZIP" kernel.img >/dev/null
          sha256sum "$ZIP" | tee "$GITHUB_WORKSPACE/B1C1-A10-AnyKernel3.sha256"

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: B1C1-A10-AnyKernel3
          path: |
            ${{ env.ZIP }}
            B1C1-A10-AnyKernel3.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="b1c1-a10-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/$ZIP" \
            "$GITHUB_WORKSPACE/B1C1-A10-AnyKernel3.sha256" \
            --target test \
            --title "B1C1 Android 10 Kernel $TAG" \
            --notes "B1C1 Pixel 3 kernel for Stock Android 10. AnyKernel3 package built from the test branch. Boot compatibility is not claimed until hardware boot testing is completed."
