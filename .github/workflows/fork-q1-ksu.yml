name: Fork Kirisakura Q1 + KSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: kirisakura-q1
  UPSTREAM_REPO: https://github.com/freak07/Kirisakura_Bluecross.git
  UPSTREAM_BRANCH: Release_Q_1
  KSU_REPO_BRANCH: thirteen-next-2
  START_DATE: '2026-05-21 00:00:00'
  END_DATE: '2026-07-18 23:59:59'

jobs:
  integrate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          ref: kirisakura
          fetch-depth: 1
          submodules: false

      - name: Fork Q1 baseline and integrate KSU Next + SUSFS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bias8145"
          git config user.email "bias.khaliq@gmail.com"

          rm -rf "$RUNNER_TEMP/q1-kernel"
          git clone --no-tags --filter=blob:none "$UPSTREAM_REPO" "$RUNNER_TEMP/q1-kernel"
          cd "$RUNNER_TEMP/q1-kernel"

          git fetch --no-tags origin "refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          git remote add bias "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags bias "refs/heads/$KSU_REPO_BRANCH:refs/remotes/bias/$KSU_REPO_BRANCH"

          git switch --detach "refs/remotes/upstream/$UPSTREAM_BRANCH"
          git switch -C "$TARGET_BRANCH"

          mapfile -t COMMITS < <(git log --reverse --format=%H --since="$START_DATE" --until="$END_DATE" "refs/remotes/bias/$KSU_REPO_BRANCH")
          TOTAL=${#COMMITS[@]}
          echo "Found $TOTAL commits in requested period"
          test "$TOTAL" -gt 0

          applied=0
          skipped=0
          for sha in "${COMMITS[@]}"; do
            subject="$(git show -s --format=%s "$sha")"
            echo "=== [$((applied + skipped + 1))/$TOTAL] $sha ==="
            echo "$subject"

            if git cherry-pick -x "$sha"; then
              applied=$((applied + 1))
              continue
            fi

            if git diff --check >/dev/null 2>&1; then
              :
            fi

            echo "Conflict detected; taking incoming thirteen-next-2 version for all conflicted paths"
            git checkout --theirs -- . || true
            git add -A

            if git diff --cached --quiet; then
              git cherry-pick --skip
              skipped=$((skipped + 1))
              echo "Skipped empty commit: $sha"
            else
              GIT_EDITOR=true git cherry-pick --continue
              applied=$((applied + 1))
            fi
          done

          echo "Applied commits: $applied"
          echo "Skipped empty commits: $skipped"
          test $((applied + skipped)) -eq "$TOTAL"

          echo "=== Verify KSU/SUSFS integration ==="
          test -f drivers/kernelsu/ksu.c
          test -f drivers/kernelsu/ksud.c
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -Rqs "CONFIG_KSU" drivers/kernelsu Kconfig drivers 2>/dev/null || true
          grep -Rqs "SUSFS" fs include drivers 2>/dev/null

          echo "=== Publish Q1 integrated branch ==="
          git push --force bias "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Remove temporary controller workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fork-q1-ksu.yml
          git config user.name "Bias8145"
          git config user.email "bias.khaliq@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary Q1 integration workflow"
            git push origin HEAD:kirisakura
          fi
